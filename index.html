<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA-portalen — Velg prosjekt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">

    <header class="hero">
      <span class="eyebrow">RA-portalen</span>
      <h1>Velg prosjekt</h1>
    </header>

    <main>

      <a class="card" href="sandra.html" data-project="SandRA">
        <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
        <div class="card-body">
          <svg class="card-diagram" viewBox="0 0 240 96" aria-hidden="true">
            <path d="M10 70 L40 70 L40 40 L90 40 L90 70 L130 70" />
            <circle cx="130" cy="70" r="18" />
            <path d="M148 70 L200 70 L200 30 L230 30" />
            <path d="M40 40 L40 20 L70 20" />
          </svg>
          <div>
            <div class="card-name">SandRA</div>
          </div>
          <span class="card-cta">Åpne prosjekt <span class="arrow">→</span></span>
        </div>
        <div class="title-block">
          <div class="tb-field">
            <div class="tb-label">Prosjektnr</div>
            <div class="tb-value">1354</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Oppdragsgiver</div>
            <div class="tb-value">Sandefjord Kommune</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Status</div>
            <div class="tb-value">Pågående</div>
          </div>
        </div>
      </a>

      <a class="card card-energy" href="vallora.html" data-project="ValløRA">
        <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
        <div class="card-body">
          <svg class="card-diagram" viewBox="0 0 240 96" aria-hidden="true">
            <path d="M10 30 L50 30 L50 60 L90 60" />
            <circle cx="110" cy="60" r="18" />
            <path d="M128 60 L160 60 L160 80 L230 80" />
            <path d="M160 60 L160 40 L200 40" />
          </svg>
          <div>
            <div class="card-name">ValløRA</div>
          </div>
          <span class="card-cta">Åpne prosjekt <span class="arrow">→</span></span>
        </div>
        <div class="title-block">
          <div class="tb-field">
            <div class="tb-label">Prosjektnr</div>
            <div class="tb-value">1355</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Oppdragsgiver</div>
            <div class="tb-value">Tønsberg Renseanlegg IKS</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Status</div>
            <div class="tb-value">Forprosjekt</div>
          </div>
        </div>
      </a>

    </main>

  </div>

  <footer>
    <span>RA-PORTALEN</span>
    <span id="clock"></span>
  </footer>

  <script src="script.js"></script>

</body>
</html>
