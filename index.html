<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA-portalen — Velg prosjekt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page">

    <header class="hero">
      <h1>Renseanlegg prosjekter</h1>
      <p class="hero-subtitle">Velg prosjektet du vil se</p>
    </header>

    <main>

      <a class="card" href="sandra.html" data-project="SandRA">
        <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
        <div class="card-body has-photo" style="--card-photo: url('images/sandra-anlegg.png');">
          <div>
            <div class="card-name">SandRA</div>
          </div>
          <span class="card-cta">Åpne prosjekt <span class="arrow">→</span></span>
        </div>
        <div class="title-block">
          <div class="tb-field">
            <div class="tb-label">Prosjektnr</div>
            <div class="tb-value">1354</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Oppdragsgiver</div>
            <div class="tb-value">Sandefjord Kommune</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Status</div>
            <div class="tb-value">Pågående</div>
          </div>
        </div>
      </a>

      <a class="card card-energy" href="vallora.html" data-project="ValløRA">
        <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
        <div class="card-body has-photo" style="--card-photo: url('images/vallora-anlegg.jpg');">
          <div>
            <div class="card-name">ValløRA</div>
          </div>
          <span class="card-cta">Åpne prosjekt <span class="arrow">→</span></span>
        </div>
        <div class="title-block">
          <div class="tb-field">
            <div class="tb-label">Prosjektnr</div>
            <div class="tb-value">1355</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Oppdragsgiver</div>
            <div class="tb-value">Tønsberg kommune</div>
          </div>
          <div class="tb-field">
            <div class="tb-label">Status</div>
            <div class="tb-value">Pågående</div>
          </div>
        </div>
      </a>

    </main>

  </div>

  <footer>
    <span>RENSEANLEGG PROSJEKTER</span>
    <span id="clock"></span>
  </footer>

  <script src="script.js"></script>

</body>
</html>
